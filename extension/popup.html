<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QATrack Recorder</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #0f1117;
      color: #f8fafc;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #c084fc;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #94a3b8;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #2e303a;
      background: #1f2028;
      color: #fff;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #c084fc 0%, #9333ea 100%);
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover {
      opacity: 0.9;
    }
    .toggle-btn {
      background: #1f2028;
      border: 1px solid #2e303a;
    }
    .toggle-btn.active {
      background: linear-gradient(135deg, #2dd4bf 0%, #0f766e 100%);
      border-color: transparent;
    }
    .toggle-btn.recording {
      background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
      border-color: transparent;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(244, 63, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
    }
    #statusMessage {
      font-size: 12px;
      color: #2dd4bf;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>QATrack</h2>
  
  <div id="loginSection">
    <div class="form-group">
      <label>QATrack Backend URL</label>
      <input type="text" id="backendUrl" value="http://localhost:3000">
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" value="admin">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" value="p@55w0rd">
    </div>
    <button id="loginBtn">Connect</button>
  </div>

  <div id="actionSection" style="display: none;">
    <button id="spyBtn" class="toggle-btn">Start Object Spy</button>
    <button id="recordBtn" class="toggle-btn">Start Recording</button>
    <div id="statusMessage"></div>
    <hr style="border-color: #2e303a; margin: 16px 0;">
    <button id="logoutBtn" style="background: transparent; border: 1px solid #2e303a;">Disconnect</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
